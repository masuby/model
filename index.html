<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>INFORM Tanzania — Sub-national Risk & Crisis Severity</title>
    <meta name="description" content="INFORM Tanzania: the open, evidence-based index of disaster risk for all 195 councils and 31 regions of Tanzania, with crisis-severity analysis and a transparent methodology." />
    <meta name="theme-color" content="#1d6deb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070c17" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="INFORM Tanzania" />
    <meta property="og:description" content="Sub-national disaster risk and crisis severity for every council in Tanzania." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('inform.prefs') || '{}');
          var t = (p.state && p.state.theme) || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var lang = p.state && p.state.language;
          if (lang) document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>INFORM Tanzania needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
